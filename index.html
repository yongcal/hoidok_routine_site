<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOIDOK</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #111111;
      text-align: center;
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 24px;
    }

    .hero-image {
      width: 100%;
      max-width: 800px;
      border-radius: 18px;
      margin-bottom: 45px;
    }

    h1 {
      font-size: 52px;
      margin: 0 0 12px;
      letter-spacing: -1px;
    }

    .tagline {
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 24px;
    }

    .description {
      font-size: 18px;
      line-height: 1.7;
      color: #555;
      max-width: 650px;
      margin: 0 auto 50px;
    }

    h2 {
      font-size: 28px;
      margin-bottom: 18px;
    }

    .apps {
      font-size: 18px;
      line-height: 2;
      margin-bottom: 55px;
    }

    footer {
      border-top: 1px solid #ddd;
      padding-top: 28px;
      font-size: 14px;
      color: #777;
    }

    footer a {
      color: #555;
      text-decoration: none;
      margin: 0 8px;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <img src="image.png" alt="HOIDOK Routine" class="hero-image">

    <h1>HOIDOK</h1>
    <div class="tagline">Learn. Repeat. Achieve.</div>

    <div class="description">
      HOIDOK creates simple tools for language learning and building better habits.
    </div>

    <h2>Our Apps</h2>

    <div class="apps">
      HOIDOK JLPT<br>
      HOIDOK HSK<br>
      HOIDOK TOEIC<br>
      HOIDOK Routine
    </div>

    <footer>
      © Yongcal Company
    </footer>

  </div>
</body>
</html>
